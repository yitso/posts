name: Build and deploy posts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: yitso/itso/.github/workflows/build-engine.yml@1c488a84f58aa2bf0326dec8b358b790e6bc2a97
    with:
      content_ref: ${{ github.sha }}
      site_config_path: configs/site.json
      site_base: /posts/

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content and checks
        uses: actions/checkout@v4
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pages and assets
        run: python scripts/check_site.py dist

  package-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: package-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
